
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="الموقع الرسمي للدكتور عمر محمد أبو المكارم، استشاري أمراض الباطنة والقلب والسكر وحساسية الصدر. تعرّف على الخدمات ومواقع العيادات واحجز موعدك.">

  <title>د. عمر أبو المكارم | Dr. Omar Abu Al-Makarem</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;800&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <style>
    /* حماية إضافية للصورة والتخطيط */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      overflow-x: clip;
    }

    img, svg, iframe {
      max-width: 100%;
    }

    .wrap {
      width: 100%;
      min-width: 0;
    }

    .photo {
      width: min(100%, 430px);
      min-width: 0;
    }

    .arch {
      width: 100%;
      overflow: hidden;
    }

    .arch img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center 20%;
    }

    .hero .wrap > div {
      min-width: 0;
    }

    .pill {
      max-width: 100%;
      min-height: 44px;
    }

    .cl, .grid, .clinic {
      min-width: 0;
    }

    .clinic {
      overflow-wrap: anywhere;
    }

    .map {
      width: 100%;
      min-width: 0;
    }

    .map iframe {
      display: block;
      width: 100%;
      height: 230px;
      border: 0;
    }

    @media (max-width: 820px) {
      .hero .wrap {
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
      }

      .hero .wrap > div:first-child {
        text-align: center;
      }

      .hero .btns,
      .hero .stats {
        justify-content: center;
      }

      .hero p.lead {
        margin-inline: auto;
      }

      .photo {
        order: -1;
        width: min(68%, 290px);
        margin-inline: auto;
      }

      .cl {
        grid-template-columns: minmax(0, 1fr);
      }

      .cl.one {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 480px) {
      .wrap {
        padding-inline: 14px;
      }

      .nav .wrap {
        gap: 6px;
      }

      .logo {
        gap: 6px;
        font-size: clamp(12px, 3.5vw, 16px);
      }

      .logo i {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }

      .tools {
        gap: 5px;
        flex-shrink: 0;
      }

      .tools .pill {
        padding: 7px 10px;
        font-size: 12px;
      }

      .photo {
        width: min(62%, 225px);
        max-width: 225px;
      }

      .arch {
        padding: 5px;
        border-radius: 999px 999px 20px 20px;
      }

      .arch img {
        aspect-ratio: 4 / 5;
        border-radius: 999px 999px 16px 16px;
        object-position: center 18%;
      }

      .hero h1 {
        font-size: clamp(29px, 8vw, 36px);
        overflow-wrap: anywhere;
      }

      .hero .btns .pill,
      .book .btns .pill {
        justify-content: center;
        padding: 9px 11px;
        font-size: 12px;
      }

      .grid,
      .cl,
      .cl.one {
        grid-template-columns: minmax(0, 1fr);
      }

      .act .pill {
        min-width: 0;
        padding-inline: 8px;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .map iframe {
        height: 210px;
      }

      .book {
        padding: 34px 16px;
      }

      .float {
        width: 52px;
        height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
